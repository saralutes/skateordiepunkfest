<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skate or Die Punk Fest</title>
    <meta name="description" content="A Skating and Music Festival in Sturgeon Bay Wisconsin. A celebration of music and skating featuring local bands from wisconsin and chicago at the Sturgeon Bay Skatepark.">
    <!-- Bootstrap 5.3.7 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="text-light">
    <header class="text-center py-4">
        <h1 class="">Skate or Die Punk Fest</h1>
        <p class="sub-header-font">A celebration of music and skating</p>
    </header>
    <main class="container">
        <section class="row align-items-start">
            <!-- Left Column: Flyer -->
            <div class="col-12 col-md-6 d-flex justify-content-center mb-4 mb-md-0 p-5 flyer-container">
                <img src="flyer.svg" alt="Event Flyer" class="img-fluid">
            </div>
            <!-- Right Column: Bands -->
            <div class="col-12 col-md-6">
                <h2 class="bands-title">MUSIC</h2>
                <ul class="bands-list list-unstyled text-center">
                    <li>
                        <a href="https://www.sleepersound.com/" target="_blank" rel="noopener" class="band-link band-sleepersound">Sleepersound</a>
                    </li>
                    <li>
                        <a href="https://vilebees.bandcamp.com/" target="_blank" rel="noopener" class="band-link">Vile Bees</a>
                    </li>
                    <li>
                        <a href="https://braince.bandcamp.com/album/braince" target="_blank" rel="noopener" class="band-link">Braince</a>
                    </li>
                    <li>
                        <a href="https://www.keyofevil.com/" target="_blank" rel="noopener" class="band-link band-keyofevil">Key of Evil</a>
                    </li>
                    <li>
                        <a href="https://www.instagram.com/noparkingmke/" target="_blank" rel="noopener" class="band-link">No Parking</a>
                    </li>
                    <li>
                        <a href="https://beetlegork.bandcamp.com/" target="_blank" rel="noopener" class="band-link">Beetlegork</a>
                    </li>
                    <li>
                        <a href="https://fivemodfour.bandcamp.com/album/eons" target="_blank" rel="noopener" class="band-link">The Five Mod Four</a>
                    </li>
                    <li>
                        <a href="https://www.instagram.com/the.band.spot/" target="_blank" rel="noopener" class="band-link">Spot</a>
                    </li>
                    <li>
                        <a href="https://www.instagram.com/dirtysquirreldrama/" target="_blank" rel="noopener" class="band-link">Dirty Squirrel Drama</a>
                    </li>
                </ul>
            </div>
        </section>
        <section class="row align-items-start my-1">
            <div class="col-12">
                <h2 class="bands-title">Featured Sponsors</h2>
            </div>
            <div class="row">
                <div class="col">
                    <a href="https://bremencafe.com/" target="_blank" rel="noopener">
                        <img class="img-fluid" src="sponsorImages/Bremen.jpg" alt="Bremen Cafe">
                    </a>
                </div>
                <div class="col">
                    <a href="https://dipteridrecords.bandcamp.com/artists" target="_blank" rel="noopener">
                        <img class="img-fluid" src="sponsorImages/DipteridRecords.jpg" alt="Dipterid Records">
                    </a>
                </div>
                <div class="col">
                    <a href="https://www.beachharborresort.com/" target="_blank" rel="noopener">
                        <img class="img-fluid" src="sponsorImages/beachHarbor.svg" alt="Beach Harbor Resort">
                    </a>
                </div>
                <div class="col">
                    <a href="https://expertworkrecords.bandcamp.com/" target="_blank" rel="noopener">
                        <img class="img-fluid" src="sponsorImages/ExpertWorkRecords.jpg" alt="Expert Work Records">
                    </a>
                </div>
            </div>
        </section>
    </main>
    <footer class="text-center py-3 my-1">
        <p>&copy; 2025 Skate or Die Punk Fest <a href="mailto:skateordiepunkfest@gmail.com">skateordiepunkfest@gmail.com</a></p>
    </footer>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
</body>
</html>
